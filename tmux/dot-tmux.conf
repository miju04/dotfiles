# Default Tmux Configuration

# Set prefix to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Use vi-mode for copy mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set-option -sg escape-time 10

# Start windows, panes and session list at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
bind s choose-tree -Zs -K '#{?#{e|<:#{line},9},#{e|+:#{line},1},}'

# Enable mouse mode
set -g mouse on

set -g history-limit 50000

set -g set-clipboard on

# More intuitive keybindings for splitting panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

# Keybindings for switching panes with vim-like keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim-like keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config file with r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

bind-key f display-popup -E -w 80% -h 60% ~/.config/tmux/tmux-sessionizer.sh

# Toggle between the current and previous session
bind Space switch-client -l

# Cycle through pane layouts
bind -r e next-layout

set -g detach-on-destroy off

# Visual notifications
set -g visual-activity on
set-window-option -g monitor-activity on

# 256 color support
set-option -a terminal-overrides "xterm-256color:Tc"
set-option -g focus-events on

# TokyoNight theme
source-file "~/.config/tmux/tokyonight_night.tmux" 

